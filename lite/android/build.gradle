plugins {
    id 'com.android.application' version '8.12.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
}

// What the three libraries read from the root project, and where "react-native:+" comes from
// when there is no React Native plugin to substitute it.
ext {
    RN_VERSION = '0.73.11'
    kotlinVersion = '2.1.20'
    compileSdkVersion = 36
    targetSdkVersion = 28
    minSdkVersion = 21
}
subprojects {
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.facebook.react:react-native') using module("com.facebook.react:react-android:${rootProject.ext.RN_VERSION}")
        }
    }
}

// The libraries default their Java level to 1.8 while Kotlin 2.1 targets the JDK's 17: one level for all.
subprojects {
    afterEvaluate { p ->
        if (p.extensions.findByName('android') != null) {
            p.android.compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
        }
        p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '17' } }
    }
}
