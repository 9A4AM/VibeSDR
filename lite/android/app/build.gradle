plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def MAIN   = file("../../../android/app/src/main")          // the main app's sources — READ ONLY
def NATIVE = file("../../native")                            // Lite's API-21 prebuilts
def serverVersion = (file("../../../vibeserver/CMakeLists.txt").text =~ /project\(vibeserver VERSION ([0-9.]+)/)[0][1]

android {
    // ★ The NAMESPACE stays com.vibesdr.app: the engine's JNI symbols are Java_com_vibesdr_app_*,
    //   and the shared Kotlin lives in that package. The APPLICATION ID is Lite's own, so both
    //   apps install side by side.
    namespace 'com.vibesdr.app'
    compileSdk 36
    ndkVersion '27.1.12297006'

    defaultConfig {
        applicationId 'com.vibesdr.serverlite'
        minSdkVersion 21            // Android 5.0 — a 2017 Fire 7 is 5.1.1 (API 22)
        targetSdkVersion 28         // ★ sideload-only: old enough that an old tablet's rules apply
        versionCode 1
        versionName serverVersion + "-lite"
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DSDR_KIT_ROOT=${NATIVE}/kit",
                          "-DOPUS_A=${NATIVE}/opus/lib/armeabi-v7a/libopus.a"
            }
        }
    }
    externalNativeBuild { cmake { path "${MAIN}/cpp/CMakeLists.txt"; version '3.22.1' } }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // ★ cloudflared is an EXECUTABLE named lib*.so; it must be extracted to nativeLibraryDir to run.
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets {
        main {
            java.srcDirs += ["${buildDir}/shared-src"]
            res.srcDirs  += ["${buildDir}/shared-res"]
            jniLibs.srcDirs += ["${buildDir}/lite-jniLibs"]
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
}

// ★★ THE SHARED KOTLIN IS SYNCED, NOT COPIED INTO THE REPO. These are the React-free files that
//    start and keep a VibeServer; Lite compiles the main app's own copies, so a fix there is a fix
//    here. Anything that imports React or Expo stays out.
def SHARED = ['VibeLocalSDR.kt', 'VibeServerBoot.kt', 'VibeServerRestore.kt', 'RtlTcpServerService.kt',
              'VibeTunnel.kt', 'VibeGeoData.kt', 'VibeHttp.kt', 'VibeWifiLock.kt']
tasks.register('syncShared', Sync) {
    from("${MAIN}/java/com/vibesdr/app") { include SHARED }
    into "${buildDir}/shared-src/com/vibesdr/app"
    doLast {
        // ★ ONE LIST OF SUPPORTED DONGLES. VibeServerRestore asks VibeLocalSdrModule (a React module)
        //   for it; rather than keep a second copy, the set is lifted out of that file at build time.
        def src = new File("${MAIN}/java/com/vibesdr/app/VibeLocalSdrModule.kt").text
        def m = (src =~ /(?s)internal val RTL_SDR_VIDPIDS: Set<Int> = (listOf\(.*?\)\.map \{[^}]*\}\.toSet\(\))/)
        if (!m.find()) throw new GradleException("RTL_SDR_VIDPIDS not found in VibeLocalSdrModule.kt — its shape changed")
        new File("${buildDir}/shared-src/com/vibesdr/app/VibeLocalSdrModule.kt").text =
            "package com.vibesdr.app\n// GENERATED by lite/android/app/build.gradle from the main app's VibeLocalSdrModule.kt\n" +
            "object VibeLocalSdrModule {\n    internal val RTL_SDR_VIDPIDS: Set<Int> = ${m.group(1)}\n}\n"
    }
}
tasks.register('syncSharedRes', Sync) {
    from("${MAIN}/res/xml") { include 'device_filter.xml' }
    into "${buildDir}/shared-res/xml"
}
tasks.register('syncJniLibs', Sync) {
    from("${NATIVE}/kit/armeabi-v7a/lib") { include 'librtlsdr.so', 'libusb1.0.so' }
    from("${NATIVE}/cloudflared/armeabi-v7a") { include 'libcloudflared.so' }
    into "${buildDir}/lite-jniLibs/armeabi-v7a"
}
preBuild.dependsOn syncShared, syncSharedRes, syncJniLibs

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'      // the main app's version (VibeHttp)
}
