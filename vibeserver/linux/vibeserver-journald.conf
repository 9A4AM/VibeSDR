# ★★★ A RECEIVER MUST NOT EAT THE DISK IT IS INSTALLED ON.
#
# VibeServer is meant to run on appliance-class hardware — a Pi, an old thin client, a TV stick with
# 8 GB of eMMC and no spare. journald's own default is SystemMaxUse=10% of the filesystem capped at
# 4 GB, which on such a box is the difference between "a radio" and "a full disk in a few months".
# Measured on the Pi 500, 2026-09-20: 21 MB of journal in 8h19m — ~60 MB/day, ~1.8 GB/month, i.e.
# the whole of an 8 GB stick inside five months, with nobody having done anything wrong.
#
# ★★ THIS IS A DEFAULT, NOT A POLICY. Drop-ins in /etc BEAT drop-ins in /usr, so an operator who
#    wants more keeps it by writing /etc/systemd/journald.conf.d/<name>.conf — their file wins and
#    an upgrade of this package never argues with it. Our own debug boxes do exactly that.
#
# ★ It is machine-wide because journald has no per-unit quota. The alternative — LogNamespace= on
#   our units, which WOULD be per-service — gives us a private journal that `journalctl -u
#   vibeserver` cannot see, and we have already lost a day to a journal that looked silent because
#   it was somewhere else (see the per-radio unit trap). A cap everyone can find beats a tidy one
#   nobody can.
[Journal]
# Stuart, 2026-09-20: "I dont want anything more than a couple hundred MB of logs at most."
SystemMaxUse=200M
# ★ The journal is often VOLATILE on these boxes (/run/log/journal — i.e. RAM) when /var is not yet
#   mounted at journald start. Uncapped that is 10% of RAM, taken from a machine doing real-time DSP.
RuntimeMaxUse=100M
# ★ Small files, so rotation is granular: losing the newest file to a power cut loses minutes, not
#   the lot, and a corrupt file costs 20 MB of history rather than 200.
SystemMaxFileSize=20M
RuntimeMaxFileSize=10M
# ★ Age matters as much as size on a quiet receiver — a year-old boot is not diagnostics, it is ballast.
MaxRetentionSec=1month
